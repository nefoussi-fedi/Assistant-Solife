name: Build and Push Docker Image

# Ce workflow se déclenche automatiquement à chaque "push" sur la branche main
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Prépare l'outil de construction d'image Docker
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Se connecte à Docker Hub avec les secrets qu'on a configurés
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Construit l'image et l'envoie sur Docker Hub
      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/solife-flask:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/solife-flask:${{ github.sha }}
