services:
  solife-flask:
    build: .
    container_name: solife-flask-container
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - CHAT_WEBHOOK_URL=${CHAT_WEBHOOK_URL}
      - LOGIN_WEBHOOK_URL=${LOGIN_WEBHOOK_URL}
    networks:
      - solife-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  n8n-container:
    image: n8nio/n8n
    container_name: n8n-container
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/n8n-workflows:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["n8n import:workflow --separate --input=/n8n-workflows && n8n publish:workflow --id=V1PczdqDj0vl9tjG && n8n publish:workflow --id=frwOyhXpDAmyS7l6 && n8n start"]
    networks:
      - solife-network
    restart: unless-stopped
    depends_on:
      mongodb-container:
        condition: service_healthy
      qdrant-container:
        condition: service_healthy

  mongodb-container:
    image: mongo
    container_name: mongodb-container
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - solife-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  qdrant-container:
    image: qdrant/qdrant
    container_name: qdrant-container
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - solife-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  n8n_data:
  mongo_data:
  qdrant_storage:

networks:
  solife-network:
    name: solife-network
    external: true

