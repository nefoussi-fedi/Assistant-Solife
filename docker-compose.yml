services:
  solife-flask:
    build: .
    container_name: solife-flask-container
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - CHAT_WEBHOOK_URL=${CHAT_WEBHOOK_URL}
      - LOGIN_WEBHOOK_URL=${LOGIN_WEBHOOK_URL}
    networks:
      - solife-network
    restart: unless-stopped

  n8n-container:
    image: n8nio/n8n
    container_name: n8n-container
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - solife-network
    restart: unless-stopped

  mongodb-container:
    image: mongo
    container_name: mongodb-container
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - solife-network
    restart: unless-stopped

  qdrant-container:
    image: qdrant/qdrant
    container_name: qdrant-container
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - solife-network
    restart: unless-stopped

volumes:
  n8n_data:
  mongo_data:
  qdrant_storage:

networks:
  solife-network:
    external: true

